name: Zomato Timings Sync

on:
  schedule:
    - cron: '0 * * * *'  # Runs at the top of every hour
  workflow_dispatch:      # Allows manual trigger from the GitHub Actions tab

jobs:
  sync_timings:
    runs-on: macos-latest
    
    # We restrict concurrency so two jobs don't run at the exact same time
    concurrency: 
      group: zomato-sync
      cancel-in-progress: false

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium

    - name: Run Zomato Automation
      env:
        SHEET_ID: ${{ secrets.SHEET_ID }}
        VISIBLE_TAB: ${{ secrets.VISIBLE_TAB }}
        HIDDEN_TAB: ${{ secrets.HIDDEN_TAB }}
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        ZOMATO_COOKIES_JSON: ${{ secrets.ZOMATO_COOKIES_JSON }}
        ZOMATO_EMAIL: ${{ secrets.ZOMATO_EMAIL }}
        ZOMATO_PASSWORD: ${{ secrets.ZOMATO_PASSWORD }}
        UPDATE_METHOD: api
        HEADLESS: true
      run: |
        python main.py
